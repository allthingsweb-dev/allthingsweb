name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # oxlint and the root workspace (brand, core, web, tools/xss-scan).
      - name: 📥 Download root deps
        run: bash "$GITHUB_WORKSPACE/.github/scripts/bun-install.sh"

      # Type-aware rules and import checks read every package's types, so
      # each package with its own lockfile gets its dependencies too.
      - name: 📥 Download app deps
        working-directory: app
        run: bash "$GITHUB_WORKSPACE/.github/scripts/bun-install.sh"

      - name: 📥 Download CLI deps
        working-directory: atw-cli
        run: bash "$GITHUB_WORKSPACE/.github/scripts/bun-install.sh"

      - name: 📥 Download infra deps
        working-directory: infra
        run: bash "$GITHUB_WORKSPACE/.github/scripts/bun-install.sh"

      - name: 📥 Download pr-header deps
        working-directory: tools/pr-header
        run: bash "$GITHUB_WORKSPACE/.github/scripts/bun-install.sh"

      # web/src imports the manifest its build writes to web/dist.
      - name: 🏗️ Build web
        working-directory: web
        run: bun run build

      - name: 🧹 Lint
        run: bun run lint
