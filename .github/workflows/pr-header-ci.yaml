name: PR header CI

on:
  push:
    branches: ["main"]
    paths:
      - "tools/pr-header/**"
      - ".github/workflows/pr-header*.yaml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/pr-header/**"
      - ".github/workflows/pr-header*.yaml"

permissions:
  contents: read

jobs:
  test:
    name: 🧪 PR header tool
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: 📥 Download deps
        working-directory: tools/pr-header
        run: bash "$GITHUB_WORKSPACE/.github/scripts/bun-install.sh"

      - name: 💄 Format check
        working-directory: tools/pr-header
        run: bun run check

      - name: 🔍 Type check
        working-directory: tools/pr-header
        run: bun run typecheck

      - name: 🏄 Run the tests
        working-directory: tools/pr-header
        run: bun run test
