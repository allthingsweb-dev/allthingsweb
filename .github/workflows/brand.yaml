name: Brand marks

on:
  push:
    branches: ["main"]
    paths:
      - "brand/marks/**"
      - "app/public/brand/**"
      - "app/src/brand/all-things.tokens.json"
      - ".github/workflows/brand.yaml"
  pull_request:
    paths:
      - "brand/marks/**"
      - "app/public/brand/**"
      - "app/src/brand/all-things.tokens.json"
      - ".github/workflows/brand.yaml"

permissions:
  contents: read

jobs:
  marks:
    name: 🅰️ Marks are up to date
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 🐍 Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: 🔍 Check generated marks
        working-directory: brand/marks
        run: uv run --locked generate.py --check
