name: Community snapshot

# The sync Worker snapshots the community's public numbers each hour
# (core/src/community-metrics.ts), but GitHub's API refuses it: it reads
# without a key from Cloudflare's shared addresses, whose hourly allowance
# other callers use up ("answered 403 (0 left, …)" in `bun run community`).
# This reads GitHub alone with the run's built-in GITHUB_TOKEN, counted
# against this repository instead, and stores it as the sync's own role,
# site_sync (NEON_SYNC_URL), through the same snapshot: the day's first value
# stays, and the Worker leaves a source alone once the day has it. It fails
# only on what someone has to act on, as the sync's step does.
on:
  schedule:
    # Four times a day; the first stores the day's number.
    - cron: "20 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-snapshot
  cancel-in-progress: false

jobs:
  github:
    name: 🐙 GitHub's numbers
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: 📥 Download core deps
        working-directory: core
        run: bash "$GITHUB_WORKSPACE/.github/scripts/bun-install.sh"

      - name: 🐙 Snapshot GitHub's stars and forks
        working-directory: core
        env:
          DATABASE_URL: ${{ secrets.NEON_SYNC_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run --silent community-snapshot --only github
