name: PR header

# Keeps a status header (preview, CodeRabbit, findings, checks, merge state)
# at the top of every pull request description. It always runs the copy of
# tools/pr-header on main, never code from the pull request, so it is safe to
# give it a write token for pull requests from forks.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created]
  check_run:
    types: [completed]
  status:
  deployment_status:
  schedule:
    # Catches review threads resolved without an event of their own.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read
  deployments: read

concurrency:
  group: pr-header-${{ github.event.pull_request.number || github.event.issue.number || github.event.deployment.sha || github.event.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  header:
    name: PR header
    # This job's own completed check run must not start it again.
    if: github.event_name != 'check_run' || github.event.check_run.name != 'PR header'
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            tools/pr-header
            app/public/brand

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: 🪧 Update headers
        run: bun tools/pr-header/src/main.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: with a token, previews get a stable per-PR address.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_3lnclzRbyCETAcu719mQjKVP
          VERCEL_PROJECT_ID: prj_fLEr8ydZgpAUv8e7wCtJKX7e5Rpg
