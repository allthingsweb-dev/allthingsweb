name: Deploy

# Deploys the Worker replacing the app to the allthings Cloudflare account:
# a pr-<number> stage per pull request (removed when it closes) and a staging
# stage for main, each reading production's data through its own Hyperdrive.
# Prod stays a maintainer deploy until it moves accounts.
on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'staging' }}

jobs:
  deploy:
    name: 🚀 Deploy
    # Pull requests from forks don't get the deploy secrets.
    if: >-
      github.event.action != 'closed' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'staging' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: 📥 Download deps
        run: |
          bun install --frozen-lockfile
          (cd infra && bun install --frozen-lockfile)

      - name: 🧱 Build web
        working-directory: web
        run: bun run build

      - name: 🚀 Deploy
        id: deploy
        working-directory: infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The origin of the stage's Hyperdrive: production's Neon database
          # as its read-only role. Destroying a stage doesn't need it.
          NEON_READER_URL: ${{ secrets.NEON_READER_URL }}
        run: |
          bun alchemy deploy --stage "$STAGE" --yes --no-input | tee deploy.log
          # The stack returns the Web Worker's URL as its webUrl output.
          url=$(sed -nE "s/^ *webUrl: '(https:[^']+)'.*/\1/p" deploy.log | tail -1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed \`$STAGE\`: $url" >> "$GITHUB_STEP_SUMMARY"

  destroy:
    name: 🧹 Destroy preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: 📥 Download deps
        run: |
          bun install --frozen-lockfile
          (cd infra && bun install --frozen-lockfile)

      - name: 🧹 Destroy
        working-directory: infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          case "$STAGE" in pr-[0-9]*) ;; *) echo "refusing to destroy $STAGE" >&2; exit 1 ;; esac
          bun alchemy destroy --stage "$STAGE" --yes --no-input
