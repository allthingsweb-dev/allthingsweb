name: CLI CI

on:
  push:
    branches: ["main"]
    paths:
      - "atw-cli/**"
      - "app/src/lib/public-api/**"
      - ".github/workflows/cli.yaml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "atw-cli/**"
      - "app/src/lib/public-api/**"
      - ".github/workflows/cli.yaml"

permissions:
  contents: read

jobs:
  test:
    name: 🧪 CLI
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # The contract test compares the CLI's schemas with the app's.
      - name: 📥 Download app deps
        working-directory: app
        run: bun install --frozen-lockfile

      - name: 📥 Download CLI deps
        working-directory: atw-cli
        run: bun install --frozen-lockfile

      - name: 💄 Format check
        working-directory: atw-cli
        run: bun run check

      - name: 🔍 Type check
        working-directory: atw-cli
        run: bun run typecheck

      - name: 🏄 Run the tests
        working-directory: atw-cli
        run: bun run test

      - name: 📦 Compile and smoke-test the binary
        working-directory: atw-cli
        run: |
          bun build --compile --minify src/index.ts --outfile atw
          ./atw --version
          ./atw --help
