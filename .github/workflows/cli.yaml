name: CLI CI

on:
  push:
    branches: ["main"]
    paths:
      - "cli/**"
      - ".github/workflows/cli.yaml"
      - ".github/scripts/bun-install.sh"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "cli/**"
      - ".github/workflows/cli.yaml"
      - ".github/scripts/bun-install.sh"

permissions:
  contents: read

jobs:
  test:
    name: 🧪 CLI
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: 📥 Download CLI deps
        working-directory: cli
        run: bash "$GITHUB_WORKSPACE/.github/scripts/bun-install.sh"

      - name: 💄 Format check
        working-directory: cli
        run: bun run check

      - name: 🔍 Type check
        working-directory: cli
        run: bun run typecheck

      - name: 🏄 Run the tests
        working-directory: cli
        run: bun run test

      - name: 📦 Compile and smoke-test the binary
        working-directory: cli
        run: |
          bun build --compile --minify src/index.ts --outfile allthings
          ./allthings --version
          ./allthings --help
          # The old name still runs, with its note on stderr.
          ln -s allthings atw
          ./atw --version 2>&1 >/dev/null | grep -q "atw is now allthings"
