name: Hero photos

# Home's mosaic shows hand-picked photos (core/backfill/hero-photos.json).
# Core's hero-photos check (core/scripts/hero-photos.ts) reads production as
# the read-only site_reader role and fails if home can't show one of them:
# an image that is gone, off media.allthings.dev, not the named evening's,
# or of an evening that is a draft, someone else's, or still ahead. It runs
# when a pull request changes the photos or how they're read, on main, and
# weekly, since production can change under the file.
on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "core/backfill/hero-photos.json"
      - "core/src/hero-photos.ts"
      - "core/src/home.ts"
      - "core/src/catalog.ts"
      - "core/scripts/hero-photos.ts"
      - ".github/workflows/hero-photos.yaml"
  schedule:
    - cron: "0 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hero-photos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 🖼️ Hero photos
    # A pull request from a fork gets no secrets; main's run checks it.
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: 📥 Download core deps
        working-directory: core
        run: bash "$GITHUB_WORKSPACE/.github/scripts/bun-install.sh"

      - name: 🖼️ Check home can show every hero photo
        working-directory: core
        env:
          DATABASE_URL: ${{ secrets.NEON_READER_URL }}
        run: bun run --silent hero-photos
