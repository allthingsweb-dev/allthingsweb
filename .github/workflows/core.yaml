name: Core CI

on:
  push:
    branches: ["main"]
    paths:
      - "core/**"
      # tests/contract.test.ts holds the CLI's copy of the contract to core's.
      - "cli/src/**"
      - "docs/event-formats.md"
      - "infra/scripts/site-sync.ts"
      - "infra/scripts/login-role.ts"
      - "package.json"
      - "bun.lock"
      - "app/src/lib/**"
      # tests/collab-tools.test.ts runs the admin MCP server's collab tools through the CLI.
      - "app/scripts/collab.ts"
      - "app/migrations/**"
      - "app/package.json"
      - "app/bun.lock"
      - ".github/workflows/core.yaml"
      - ".github/scripts/bun-install.sh"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "core/**"
      # tests/contract.test.ts holds the CLI's copy of the contract to core's.
      - "cli/src/**"
      - "docs/event-formats.md"
      - "infra/scripts/site-sync.ts"
      - "infra/scripts/login-role.ts"
      - "package.json"
      - "bun.lock"
      - "app/src/lib/**"
      # tests/collab-tools.test.ts runs the admin MCP server's collab tools through the CLI.
      - "app/scripts/collab.ts"
      - "app/migrations/**"
      - "app/package.json"
      - "app/bun.lock"
      - ".github/workflows/core.yaml"
      - ".github/scripts/bun-install.sh"

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧱 Core
    runs-on: ubuntu-latest
    services:
      # Production's major version, for the migrator; PGlite (18) stands in
      # everywhere else.
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # The contract and parity tests run the app's schemas, queries and
      # MCP tools next to core's, and the migration tests replay its drizzle
      # migrations.
      - name: 📥 Download app deps
        working-directory: app
        run: bash "$GITHUB_WORKSPACE/.github/scripts/bun-install.sh"

      # core is a member of the root workspace (with web), so this installs
      # from the root lockfile.
      - name: 📥 Download core deps
        working-directory: core
        run: bash "$GITHUB_WORKSPACE/.github/scripts/bun-install.sh"

      # tests/contract.test.ts reads the CLI's copy of the contract.
      - name: 📥 Download CLI deps
        working-directory: cli
        run: bash "$GITHUB_WORKSPACE/.github/scripts/bun-install.sh"

      - name: 💄 Format check
        working-directory: core
        run: bun run check

      - name: 🔍 Type check
        working-directory: core
        run: bun run typecheck

      # docs/event-formats.md is generated from src/formats.ts.
      - name: 📄 Check the event formats doc
        working-directory: core
        run: bun run formats:doc --check

      - name: 🏄 Run the tests
        working-directory: core
        env:
          CORE_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: bun run test
