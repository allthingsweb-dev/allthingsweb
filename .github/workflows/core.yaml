name: Core CI

on:
  push:
    branches: ["main"]
    paths:
      - "core/**"
      - "app/src/lib/public-api/**"
      - "app/package.json"
      - "app/bun.lock"
      - ".github/workflows/core.yaml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "core/**"
      - "app/src/lib/public-api/**"
      - "app/package.json"
      - "app/bun.lock"
      - ".github/workflows/core.yaml"

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧱 Core
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # The contract test compares core's schemas with the app's served ones.
      - name: 📥 Download app deps
        working-directory: app
        run: bun install --frozen-lockfile

      - name: 📥 Download core deps
        working-directory: core
        run: bun install --frozen-lockfile

      - name: 💄 Format check
        working-directory: core
        run: bun run check

      - name: 🔍 Type check
        working-directory: core
        run: bun run typecheck

      - name: 🏄 Run the tests
        working-directory: core
        run: bun run test
