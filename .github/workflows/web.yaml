name: Web CI

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "core/**"
      - "infra/scripts/site-sync.ts"
      - "infra/scripts/login-role.ts"
      - "brand/**"
      - "tools/xss-scan/**"
      - "app/public/brand/**"
      - "package.json"
      - "bun.lock"
      - "app/src/app/api/v1/**"
      - "app/src/lib/**"
      - "app/package.json"
      - "app/bun.lock"
      - ".github/workflows/web.yaml"
      - ".github/scripts/bun-install.sh"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "web/**"
      - "core/**"
      - "infra/scripts/site-sync.ts"
      - "infra/scripts/login-role.ts"
      - "brand/**"
      - "tools/xss-scan/**"
      - "app/public/brand/**"
      - "package.json"
      - "bun.lock"
      - "app/src/app/api/v1/**"
      - "app/src/lib/**"
      - "app/package.json"
      - "app/bun.lock"
      - ".github/workflows/web.yaml"
      - ".github/scripts/bun-install.sh"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🌐 Web
    runs-on: ubuntu-latest
    services:
      # A real server for the SCRAM test; PGlite stands in everywhere else.
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # The parity tests run the app's v1 routes and MCP tools next to the
      # Worker.
      - name: 📥 Download app deps
        working-directory: app
        run: bash "$GITHUB_WORKSPACE/.github/scripts/bun-install.sh"

      - name: 📥 Download web and core deps
        run: bash "$GITHUB_WORKSPACE/.github/scripts/bun-install.sh"

      - name: 💄 Format check
        working-directory: web
        run: bun run check

      - name: 🔍 Type check
        working-directory: web
        run: bun run typecheck

      # Templates must escape what they interpolate; unescaped content fails.
      - name: 🛡️ XSS scan
        working-directory: web
        run: bun run xss-scan

      # The Worker runs in workerd through Alchemy's local runtime; nothing
      # is deployed and no Cloudflare credentials exist here.
      - name: 🏄 Run the tests
        working-directory: web
        env:
          WEB_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: bun run test
