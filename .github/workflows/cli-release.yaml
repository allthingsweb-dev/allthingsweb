on:
    push:
        tags:
            - '*'

name: Release a New Version of the CLI

permissions:
    contents: write
 
jobs:
    releaseandpublish:
        name: Release on Github
        runs-on: ubuntu-latest
        steps:
            - name: ⬇️ Checkout repo
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  fetch-depth: 0
                  fetch-tags: false
                  persist-credentials: false
               
            - name: ⎔ Setup bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

            - name: 🔎 Check the tag matches the CLI version
              run: |
                  VERSION=$(jq -r .version cli/package.json)
                  if [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
                    echo "::error::Tag $GITHUB_REF_NAME does not match cli/package.json version $VERSION"
                    exit 1
                  fi

            - name: 📥 Download deps
              run: bash "$GITHUB_WORKSPACE/.github/scripts/bun-install.sh"
              working-directory: cli

            - name: 🔨 Compiling the different versions
              run: make build-all-cli

            - name: 🏷 Create GitHub Release
              run: |
                  TAG_NAME=${GITHUB_REF_NAME}
                  TAG_MESSAGE=$(git tag -l --format='%(contents)' "$TAG_NAME")
                  # Hyphenated tags (2.0.0-alpha.1) are prereleases; the installer skips them.
                  PRERELEASE=()
                  if [[ "$TAG_NAME" == *-* ]]; then PRERELEASE=(--prerelease); fi
                  gh release create "${TAG_NAME}" --title "Release ${TAG_NAME}" --notes "${TAG_MESSAGE}" "${PRERELEASE[@]}"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: 🚀 Upload Assets
              run: |
                  ASSET_PLATFORMS=("bun-linux-x64" "bun-linux-arm64" "bun-windows-x64.exe" "bun-darwin-x64" "bun-darwin-arm64")
                  for platform in "${ASSET_PLATFORMS[@]}"; do
                    if [ -f "cli/allthings-$platform" ]; then
                      gh release upload "${GITHUB_REF_NAME}" "cli/allthings-$platform" --clobber
                      echo "✅ Uploaded file for platform $platform"
                    else
                      echo "❌ File for platform $platform not found, skipping."
                    fi
                  done
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Its own job, after the GitHub release, so the release never waits on
    # npm and a failed publish can be re-run alone.
    npm:
        name: Publish to npm
        needs: releaseandpublish
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: ⬇️ Checkout repo
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false

            - name: ⎔ Setup bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

            - name: 📥 Download deps
              run: bash "$GITHUB_WORKSPACE/.github/scripts/bun-install.sh"
              working-directory: cli

            # Packing builds the bundle (prepack). A prerelease goes to the
            # alpha dist-tag and a release to latest. npm gives a package's
            # first version latest whatever its tag, and latest can't be
            # removed, so until a stable release exists latest follows the
            # newest prerelease instead of staying on the first one. What
            # latest is gets read before publishing, and a failed read stops
            # the step: it never counts as "no stable release yet". The step
            # checks the registry's dist-tags before it calls it done.
            - name: 📦 Publish to npm
              working-directory: cli
              run: |
                  if [ -z "${NPM_CONFIG_TOKEN:-}" ]; then
                    echo "::error::The NPM_TOKEN repository secret is not set"
                    exit 1
                  fi
                  VERSION="$GITHUB_REF_NAME"
                  TAGS_URL="https://registry.npmjs.org/-/package/allthings/dist-tags"
                  # The dist-tags as JSON, {} if the package doesn't exist
                  # (404); any other answer is retried, then fails.
                  tags() {
                    local out code
                    for _ in 1 2 3 4 5 6; do
                      if out=$(curl -sS -w '\n%{http_code}' "$TAGS_URL"); then
                        code="${out##*$'\n'}"
                        case "$code" in
                          200) printf '%s\n' "${out%$'\n'*}"; return 0 ;;
                          404) echo '{}'; return 0 ;;
                        esac
                      fi
                      sleep 10
                    done
                    echo "::error::Could not read npm dist-tags" >&2
                    return 1
                  }
                  # Its own assignment, so a failed read stops the step.
                  BEFORE=$(tags)
                  LATEST=$(jq -r '.latest // ""' <<<"$BEFORE")
                  if [[ "$VERSION" == *-* ]]; then
                    bun publish --access public --tag alpha
                    WANT_ALPHA="$VERSION"
                    if [[ -z "$LATEST" || "$LATEST" == *-* ]]; then
                      # Retried: the new version may not be visible yet.
                      for _ in 1 2 3 4 5 6; do
                        if curl -fsS -X PUT "$TAGS_URL/latest" \
                          -H "authorization: Bearer $NPM_CONFIG_TOKEN" \
                          -H "content-type: application/json" \
                          --data "\"$VERSION\"" > /dev/null; then
                          break
                        fi
                        sleep 10
                      done
                      WANT_LATEST="$VERSION"
                    else
                      WANT_LATEST="$LATEST"
                    fi
                  else
                    bun publish --access public --tag latest
                    WANT_LATEST="$VERSION"
                    WANT_ALPHA=""
                  fi
                  # The registry may take a moment to show a new version.
                  for _ in 1 2 3 4 5 6; do
                    TAGS=$(tags)
                    if [[ "$(jq -r '.latest // ""' <<<"$TAGS")" == "$WANT_LATEST" ]] &&
                      [[ -z "$WANT_ALPHA" || "$(jq -r '.alpha // ""' <<<"$TAGS")" == "$WANT_ALPHA" ]]; then
                      echo "npm dist-tags: $TAGS"
                      exit 0
                    fi
                    sleep 10
                  done
                  echo "::error::npm dist-tags are $TAGS, not latest=$WANT_LATEST${WANT_ALPHA:+ alpha=$WANT_ALPHA}"
                  exit 1
              env:
                  NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
