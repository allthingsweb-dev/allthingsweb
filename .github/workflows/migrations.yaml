name: Migration numbers

# Two migrations must never take one number (core/src/migration-guard.ts):
# on every pull request and on main, core's migrations must extend what
# production has applied, in order, read from effect_sql.migrations as the
# read-only site_reader role; and a pull request must not add a migration
# under a number another open pull request adds. A failure says what to
# renumber, and to what.
on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: 🔢 Migration numbers
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: 📥 Download core deps
        working-directory: core
        run: bash "$GITHUB_WORKSPACE/.github/scripts/bun-install.sh"

      - name: 🔢 Check migration numbers against production and open pull requests
        working-directory: core
        env:
          DATABASE_URL: ${{ secrets.NEON_READER_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # A pull request from a fork gets no secrets: it checks open pull
          # requests only, and main's run checks production when it merges.
          NO_PRODUCTION_OK: ${{ github.event.pull_request.head.repo.fork == true }}
        run: bun run --silent migration-guard
