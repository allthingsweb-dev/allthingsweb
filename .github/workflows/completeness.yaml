name: Event completeness

# Every Monday, core's completeness report (core/src/completeness.ts) reads
# production as the read-only site_reader role and fails if an evening that
# ended in the last 30 days has no talks. The full report is the run's
# summary either way.
on:
  schedule:
    - cron: "0 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: completeness
  cancel-in-progress: true

jobs:
  report:
    name: 📋 Completeness
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: 📥 Download core deps
        working-directory: core
        run: bash "$GITHUB_WORKSPACE/.github/scripts/bun-install.sh"

      - name: 📋 Report, and check recent evenings have talks
        working-directory: core
        env:
          DATABASE_URL: ${{ secrets.NEON_READER_URL }}
        run: |
          status=0
          bun run --silent completeness --check > report.txt 2>&1 || status=$?
          cat report.txt
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
